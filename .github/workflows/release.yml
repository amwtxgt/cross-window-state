name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# changesets pushes the changeset-release/main branch and opens the
# Version Packages PR — the default read-only GITHUB_TOKEN cannot do either.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    steps:
      # Requires repository secrets (configure once in Settings → Secrets):
      #   NPM_TOKEN  — automation-scoped npm token for publishing
      #   GITHUB_TOKEN is provided by Actions automatically.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production
